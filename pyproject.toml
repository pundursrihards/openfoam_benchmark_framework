[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "foambench"
version = "0.1.0"
description = "Configuration-driven, reproducible OpenFOAM benchmark orchestration"
requires-python = ">=3.10"
dependencies = ["PyYAML>=6,<7"]

[project.optional-dependencies]
test = ["pytest>=8"]
casefoam = ["casefoam"]
analysis = ["numpy", "pandas", "matplotlib", "scipy"]

[project.scripts]
foambench = "foambench.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
